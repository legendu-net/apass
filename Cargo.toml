[package]
name = "apass"
version = "0.1.0"
edition = "2024"
description = "Run commands without the need to enter your password (repeatedly)."
license = "MIT"
repository = "https://github.com/legendu-net/apass"
keywords = ["auth", "password", "expect", "tools"]

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
expectrl = { version = "0.9", features = ["polling"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
signal-hook = "0.3"
terminal_size = "0.4"
thiserror = "2"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
